<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Dokumenty · {{ title }}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
  </head>
  <body>
    <main class="shell documents-shell">
      <section class="topbar">
        <div>
          <h1>Dokumenty Markdown</h1>
          <p>Liczba dokumentów: {{ stats.documents }}.</p>
        </div>
        <div class="topbar-actions">
          <a class="documents-link" href="{{ url_for('index') }}">Chat</a>
          <form method="post" action="{{ url_for('logout') }}">
            <button class="logout-button" type="submit">Wyloguj</button>
          </form>
        </div>
      </section>

      <section class="documents-list" aria-label="Lista dokumentów Markdown">
        {% for document in documents %}
          <button
            class="document-list-item"
            type="button"
            data-document-path="{{ document.path }}"
          >
            <span class="document-list-title">{{ document.path|replace("md/", "") }}</span>
            <span class="document-list-meta">
              {{ document.title }} · {{ document.date }} · {{ document.kind }}{% if document.is_change %} · zmiana/aneks/uchylenie{% endif %}
            </span>
            <span class="document-list-path">{{ document.path }}</span>
          </button>
        {% else %}
          <p>Brak dokumentów Markdown.</p>
        {% endfor %}
      </section>
    </main>

    <div class="modal" id="document-modal" hidden>
      <div class="modal-backdrop" data-close-modal></div>
      <section class="modal-panel" role="dialog" aria-modal="true" aria-labelledby="document-title">
        <header class="modal-header">
          <div>
            <h2 id="document-title">Dokument</h2>
            <p id="document-path"></p>
          </div>
          <button id="document-close" type="button" title="Zamknij">×</button>
        </header>
        <div class="document-content" id="document-content"></div>
      </section>
    </div>

    <script>
      window.APP_BASE = {{ request.script_root|tojson }};
    </script>
    <script src="{{ url_for('static', filename='app.js') }}"></script>
  </body>
</html>
